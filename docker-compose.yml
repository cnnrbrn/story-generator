# Base stack (shared by dev and prod).
#   dev :  docker compose up --build
#          (auto-merges docker-compose.override.yml — bind-mount + reload + Adminer)
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#          (the explicit -f list skips the override file)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: storygen
      POSTGRES_PASSWORD: storygen
      POSTGRES_DB: storygen
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storygen -d storygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod          # dev override flips this to the dev stage
    ports:
      - "8010:8000"   # host 8010 -> container 8000 (8000 is used by another project)
    # LLM + Tavily keys come from the root .env. DATABASE_URL in there is for the
    # host venv; the `environment` block below overrides it (env wins over env_file)
    # so the container reaches Postgres by its compose service name.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://storygen:storygen@db:5432/storygen
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

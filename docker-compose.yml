services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: storygen
      POSTGRES_PASSWORD: storygen
      POSTGRES_DB: storygen
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storygen -d storygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the api reaches Postgres by the service name "db"
      # on its real port 5432 (not the host-published 5433).
      DATABASE_URL: postgresql+psycopg://storygen:storygen@db:5432/storygen
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
